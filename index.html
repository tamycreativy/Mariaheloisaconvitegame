<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sweet Race — Maria Heloísa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="blur"></div>
<main class="stage" id="stage">

  <section class="screen on" id="s-cover">
    <img class="bg" src="assets/bg_capa.webp" alt="">
    <img class="mono" src="assets/monograma.webp" alt="Sweet Race — Maria Heloísa">
    <div class="cover-card">O convite da <b>Maria Heloísa</b> sumiu!<br>Ajude Ralph, Vanellope e Taffyta a encontrá-lo.</div>
    <button class="btn-pink" id="start" type="button"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>Começar a aventura</button>
    <button class="skip" id="skip" type="button">Pular os games e ir para informações</button>
  </section>

  <section class="screen" id="s-video">
    <video id="abertura" src="assets/abertura.mp4" playsinline preload="auto"></video>
    <button class="tap" id="tap" type="button">Toque para assistir ▶</button>
  </section>

  <section class="screen" id="s-game"></section>

  <section class="screen" id="s-env">
    <video id="envelope" src="assets/envelope.mp4" playsinline preload="auto" style="width:100%;height:100%;object-fit:cover;display:block"></video>
    <button class="tap" id="tap2" type="button">Toque para abrir o convite ▶</button>
  </section>

  <section class="screen" id="s-info">
    <img class="bg" src="assets/info.webp" alt="Convite: Maria Heloísa 8 anos, dia 15 de dezembro às 17:00">
    <button class="hot" data-act="confirm" style="left:22%;top:78%;width:20%;height:11%" aria-label="Confirmar presença"></button>
    <button class="hot" data-act="local" style="left:40%;top:78%;width:20%;height:11%" aria-label="Local da festa"></button>
    <button class="hot" data-act="gifts" style="left:59%;top:78%;width:20%;height:11%" aria-label="Sugestões de presente"></button>
  </section>

  <section class="screen" id="s-gifts">
    <img class="bg" src="assets/presentes.webp" alt="Sugestões de presentes">
    <button class="back" id="back" type="button" aria-label="Voltar">‹</button>
  </section>

  <button class="snd" id="snd" type="button" aria-label="Som"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
</main>
<script src="js/core.js"></script>
<script src="js/race.js"></script>
<script src="js/match.js"></script>
<script src="js/factory.js"></script>
<script src="js/app.js"></script>
</body>
</html>
